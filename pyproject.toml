[project]
name = "phil-mind-rag"
version = "0.1.0"
description = "RAG system for Philosophy of Mind papers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.8",
    "gradio>=6.8.0",
    "openai>=2.24.0",
    "pydantic-settings>=2.14.0",
    "ragas>=0.4.3",
    "sentence-transformers>=5.1.1",
    "unstructured[pdf]>=0.21.5",
    "langgraph>=1.1.0",
]

[dependency-groups]
dev = [
    "ty>=0.0.32",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.4",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle — style violations
    "F",   # pyflakes — unused imports, undefined names
    "I",   # isort — import ordering
    "S",   # bandit — security checks (hardcoded passwords, eval, etc.)
    "B",   # bugbear — common gotchas (mutable defaults, bare except)
    "UP",  # pyupgrade — modern Python 3.12+ syntax
    "TCH", # type-checking — flag imports that should be under TYPE_CHECKING
]

[tool.ruff.lint.per-file-ignores]
# state.py: LangGraph calls get_type_hints(AgentState) at StateGraph construction time,
# which evaluates the lazy string annotations from `from __future__ import annotations`.
# All annotated types must therefore be importable at runtime — moving them to TYPE_CHECKING
# would cause a NameError inside LangGraph. TCH001 is suppressed for this file only.
"phil_mind_rag/agents/state.py" = ["TCH001"]
# tests: assert is the idiomatic pytest assertion — S101 is a false positive here.
"tests/**" = ["S101"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--verbose --tb=short -m 'not paid_api'"
pythonpath = ["."]
markers = [
    "paid_api: tests that call paid external APIs and are disabled by default",
]

[tool.ty.environment]
python-version = "3.12"
