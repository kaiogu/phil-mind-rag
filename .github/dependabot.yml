version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Sao_Paulo"
    cooldown:
      semver-major-days: 14
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "👷 ci"
      include: "scope"

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:30"
      timezone: "America/Sao_Paulo"
    cooldown:
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    open-pull-requests-limit: 10
    groups:
      runtime-minor-patch:
        patterns:
          - "chromadb"
          - "gradio"
          - "langgraph"
          - "openai"
          - "pydantic-settings"
          - "ragas"
          - "sentence-transformers"
          - "unstructured*"
        update-types:
          - "minor"
          - "patch"
      dev-tooling-minor-patch:
        patterns:
          - "pytest*"
          - "pytest-cov"
          - "ruff"
          - "ty"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "📦 build"
      prefix-development: "📦 build"
      include: "scope"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:00"
      timezone: "America/Sao_Paulo"
    cooldown:
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    open-pull-requests-limit: 5
    commit-message:
      prefix: "📦 build"
      include: "scope"
